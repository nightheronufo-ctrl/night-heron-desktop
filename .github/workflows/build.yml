name: 打包桌面版

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
            targets: ""
          - os: macos-15
            name: macos
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run prepare-game
      - run: npx tauri build ${{ matrix.args }}

      - name: 收集 Windows 产物
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          # GitHub 下载页的文件名不支持中文，这里用英文名
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/NightHeron_1.0.0_Windows_setup.exe
          Copy-Item src-tauri/target/release/night-heron.exe out/NightHeron_1.0.0_Windows_portable.exe
      - name: 收集 macOS 产物
        if: matrix.name == 'macos'
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/NightHeron_1.0.0_macOS_universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: night-heron-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    # 某个系统没构建成功时，也先把已经构建好的那个发布出来
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 清掉旧版里名字乱码的文件
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for a in "-.exe" "_1.0.0_x64-setup.exe"; do
            gh release delete-asset v1.0.0 "$a" -y -R ${{ github.repository }} || true
          done
      - name: 发布到 Releases（下载页）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 夜鹭骑行 桌面小窗版 v1.0.0
          body: |
            - Windows：下载 `NightHeron_1.0.0_Windows_setup.exe` 安装，或者下载 `NightHeron_1.0.0_Windows_portable.exe` 双击直接运行（免安装）。
            - Mac：下载 `NightHeron_1.0.0_macOS_universal.dmg`，Intel 和 Apple 芯片都能用。
            - 第一次打开时系统可能提醒“未知发布者”：Windows 点“更多信息 → 仍要运行”；Mac 到“系统设置 → 隐私与安全性”点“仍要打开”。

            © 2026 不明飞行鹭 · CC BY-NC-ND 4.0
          files: out/*
          overwrite_files: true
