[package]
name = "night-heron"
version = "1.0.0"
description = "夜鹭骑行 · 桌面小窗版"
authors = ["不明飞行鹭"]
license = "CC-BY-NC-ND-4.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
